name: Publish images

on:
  push:
    branches: [main]
    # Image Updater が infra/ のタグを書き戻すコミットで、再び公開が走って無限に続かないようにする。
    # infra/ はイメージの内容に含まれない。
    paths-ignore:
      - "infra/**"

permissions:
  contents: read
  packages: write

# 古い実行が後から終わって、新しいタグより前のものを最後に置くことがないよう、順番に実行する。
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # 自動更新(Argo CD Image Updater)が新しさを文字列の順で判断できるよう、タグを `UTC の日時-コミット` にする。
      - id: tag
        run: echo "value=$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # スキーマを先に公開する。マイグレーションは、直前のバージョンのアプリと互換にする(追加してから削除する)。
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile.migrate
          push: true
          tags: |
            ghcr.io/akatukisora/fuzzy-octo-doodle-migrate:${{ steps.tag.outputs.value }}
            ghcr.io/akatukisora/fuzzy-octo-doodle-migrate:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=migrate
          cache-to: type=gha,scope=migrate,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: |
            ghcr.io/akatukisora/fuzzy-octo-doodle-backend:${{ steps.tag.outputs.value }}
            ghcr.io/akatukisora/fuzzy-octo-doodle-backend:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: |
            ghcr.io/akatukisora/fuzzy-octo-doodle-frontend:${{ steps.tag.outputs.value }}
            ghcr.io/akatukisora/fuzzy-octo-doodle-frontend:main
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
