# Sync フックの Job。Cluster が Healthy になったあと(wave 1)に、アプリ(wave 3)より先にスキーマを適用する。
# PreSync にしないのは、初回の同期では Cluster がまだ存在しないため。失敗すると同期が止まり、アプリは更新されない。
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  labels:
    app.kubernetes.io/name: migrate
    app.kubernetes.io/part-of: fuzzy-octo-doodle
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "1"
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        app.kubernetes.io/name: migrate
        app.kubernetes.io/part-of: fuzzy-octo-doodle
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: ghcr.io/akatukisora/fuzzy-octo-doodle-migrate
          env:
            - name: HOME
              value: /tmp
            - name: DATABASE_HOST
              value: fuzzy-octo-doodle-db-rw
            - name: DATABASE_PORT
              value: "5432"
            - name: DATABASE_NAME_FILE
              value: /etc/database/dbname
            - name: DATABASE_USER_FILE
              value: /etc/database/username
            - name: DATABASE_PASSWORD_FILE
              value: /etc/database/password
            - name: DATABASE_SSL_MODE
              value: verify-full
            - name: DATABASE_SSL_CA_FILE
              value: /etc/database/ca.crt
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: database
              mountPath: /etc/database
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
        - name: database
          projected:
            sources:
              - secret:
                  name: fuzzy-octo-doodle-db-app
                  items:
                    - key: dbname
                      path: dbname
                    - key: username
                      path: username
                    - key: password
                      path: password
              - secret:
                  name: fuzzy-octo-doodle-db-ca
                  items:
                    - key: ca.crt
                      path: ca.crt
---
# 開発用の認証 (backend の DEV_AUTH_USER_ID) の持ち主を作る。認証方式が決まったら、このファイルの
# 末尾の Job と backend の DEV_AUTH_USER_ID / NODE_ENV を消す。何度実行しても同じ結果になる。
apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  labels:
    app.kubernetes.io/name: seed
    app.kubernetes.io/part-of: fuzzy-octo-doodle
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "2"
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: seed
        app.kubernetes.io/part-of: fuzzy-octo-doodle
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: postgres:17-alpine
          command: ["psql", "-v", "ON_ERROR_STOP=1", "-q", "-c"]
          args:
            - >-
              INSERT INTO users (id, nickname, created_at, updated_at)
              VALUES ('11111111-1111-4111-8111-111111111111', '開発ユーザー', now(), now())
              ON CONFLICT (id) DO NOTHING
          env:
            - name: PGHOST
              value: fuzzy-octo-doodle-db-rw
            - name: PGSSLMODE
              value: verify-full
            - name: PGSSLROOTCERT
              value: /etc/database/ca.crt
            - name: PGDATABASE
              valueFrom: {secretKeyRef: {name: fuzzy-octo-doodle-db-app, key: dbname}}
            - name: PGUSER
              valueFrom: {secretKeyRef: {name: fuzzy-octo-doodle-db-app, key: username}}
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: fuzzy-octo-doodle-db-app, key: password}}
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: ca
              mountPath: /etc/database
              readOnly: true
      volumes:
        - name: ca
          secret:
            secretName: fuzzy-octo-doodle-db-ca
            items:
              - key: ca.crt
                path: ca.crt
