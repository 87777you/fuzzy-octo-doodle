[tools]
node = "24"
pnpm = "10.34.7"

[tasks.install]
description = "依存関係をロックファイルどおりにインストールする"
run = "pnpm install --frozen-lockfile"

[tasks.dev]
description = "frontend と backend を並列に起動する"
depends = ["build"]
run = "pnpm -r --parallel --filter ./frontend --filter ./backend dev"

[tasks.lint]
description = "ESLint（any の禁止などの厳密な静的検査）"
depends = ["install"]
run = "pnpm exec eslint ."

[tasks.typecheck]
description = "全パッケージの型検査"
depends = ["build"]
run = "pnpm -r typecheck"

[tasks.test]
description = "全パッケージのテスト"
depends = ["build"]
run = "pnpm -r test"

[tasks.build]
description = "全パッケージのビルド（frontend は frontend/dist に静的出力）"
depends = ["install"]
run = "pnpm -r build"

[tasks."image:build"]
description = "backend の OCI イメージをビルドする"
run = "docker build -f backend/Dockerfile -t hackathon-api:ci ."

[tasks.ci]
description = "CI と同じ検証をローカルで実行する"
depends = ["lint", "typecheck", "test", "build", "image:build"]
